<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabla de productos JOCARSA</title><style>
:root{--oscuro:#143342;--cabecera:#285a72;--azul:#4196be;--claro:#8bbdd5;--borde:#d4e3eb}*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--claro);font:14px Ubuntu,Arial,sans-serif;color:#183c50}.tabla-jocarsa{width:100%;background:white;border:1px solid var(--borde)}.titulo{background:var(--azul);color:#fff;padding:13px 16px;font-weight:bold}.filtros{display:flex;gap:9px;flex-wrap:wrap;padding:12px;background:#e6f1f7;border-bottom:1px solid var(--borde)}input,select{font:inherit;border:1px solid #a8c6d7;background:#fff;color:#183c50;padding:10px 12px;min-width:0;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,0 100%)}input{flex:1;min-width:180px}input:focus-visible,select:focus-visible,th:focus-visible{outline:3px solid #e5b74a;outline-offset:2px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}th{background:var(--cabecera);color:white;padding:12px 14px;cursor:pointer;white-space:nowrap;user-select:none}th:hover{background:var(--oscuro)}td{padding:12px 14px;border-bottom:1px solid #dce3e8}tbody tr:nth-child(even){background:#f1f7fa}tbody tr:hover{background:#dceef7}.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 11px 5px 6px;border:1px solid #c8d8e2;background:#f2f7fa;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}.dot{width:19px;height:19px;display:inline-block;border:1px solid #0002}.muted{color:#647e8e}.pie{padding:11px 14px;background:#e6f1f7;color:#285a72;font-weight:600}@media(max-width:600px){body{padding:8px}.filtros{flex-direction:column}input,select{width:100%}td,th{padding:10px}}
</style></head><body><section class="tabla-jocarsa"><div class="titulo">Listado de productos</div><div class="filtros"><input id="buscar" type="search" placeholder="Buscar productos..." aria-label="Buscar"><select id="colores" aria-label="Filtrar por color"><option value="">Todos los colores</option></select><select id="estado" aria-label="Filtrar por validez"><option value="">Todos</option><option value="si">Con color válido</option><option value="no">Sin color válido</option></select></div><div class="scroll"><table><thead><tr><th data-key="name" tabindex="0">Producto ↕</th><th data-key="description" tabindex="0">Descripción ↕</th><th data-key="color" tabindex="0">Color ↕</th></tr></thead><tbody id="filas"></tbody></table></div><div class="pie" id="total"></div></section><script>
const products=[
['dual','Aplicación para dualizar','indigo','Educación'],['practicas','Gestión de prácticas de alumnos','lawngreen','Educación'],['calificaciones','Gestión de notas y evaluaciones','greenyellow','Educación'],['cuaderno','Cuaderno del profesor','dimgray','Educación'],['ventas','CRM de gestión comercial','sandybrown','Empresa'],['empresa','ERP de gestión empresarial','saddlebrown','Empresa'],['ia','Asistente de inteligencia artificial','lightskyblue','Herramientas'],['video','Editor de vídeo web','turquoise','Herramientas'],['videoconferencias','Videoconferencias y grabaciones','mediumseagreen','Infraestructura'],['cuestionarios','Cuestionarios interactivos','mediumspringgreen','Educación'],['formacion','Plataforma de formación online','royalblue','Educación'],['examenes','Gestión de exámenes','tomato','Educación'],['asistencia','Control de asistencia','teal','Educación'],['horarios','Organización de horarios','steelblue','Educación'],['actas','Gestión de actas académicas','slateblue','Educación'],['facturacion','Gestión de facturas','goldenrod','Empresa'],['ayuda','Soporte y documentación','mediumturquoise','Herramientas'],['calendario','Eventos y citas','darkorange','Herramientas'],['documentos','Gestión documental','dodgerblue','Herramientas'],['formularios','Diseño de formularios','mediumorchid','Herramientas'],['diagrama','Diagramas visuales','darkcyan','Herramientas'],['centinela','Monitorización de servidores','crimson','Infraestructura'],['iu','Sistema de interfaces','orangered','Herramientas'],['editor','Editor de código y contenidos','seagreen','Herramientas'],['pruebas','Producto sin color asignado','','Herramientas']
].map(([name,description,color,category])=>({name:'jocarsa | '+name,description,color,category}));
const $=s=>document.querySelector(s);const valido=s=>!!s&&!['transparent','currentcolor','inherit','initial','unset','revert'].includes(s.toLowerCase())&&CSS.supports('color',s);let clave='name',direccion=1;const crear=(tag,clase,texto)=>{const el=document.createElement(tag);if(clase)el.className=clase;if(texto!==undefined)el.textContent=texto;return el};[...new Set(products.filter(p=>valido(p.color)).map(p=>p.color))].sort().forEach(c=>$('#colores').add(new Option(c,c)));function render(){const q=$('#buscar').value.toLocaleLowerCase('es'),color=$('#colores').value,estado=$('#estado').value;const lista=products.filter(p=>(p.name+' '+p.description+' '+p.color).toLocaleLowerCase('es').includes(q)&&(!color||p.color===color)&&(!estado||(estado==='si')===valido(p.color))).sort((a,b)=>direccion*a[clave].localeCompare(b[clave],'es',{numeric:true,sensitivity:'base'}));const cuerpo=$('#filas');cuerpo.replaceChildren();for(const p of lista){const tr=crear('tr');tr.append(crear('td','',p.name),crear('td','',p.description));const td=crear('td');if(valido(p.color)){const chip=crear('span','chip'),dot=crear('span','dot');dot.style.backgroundColor=p.color;chip.append(dot,crear('span','',p.color));td.append(chip)}else td.append(crear('span','muted',p.color||'Sin asignar'));tr.append(td);cuerpo.append(tr)}if(!lista.length){const tr=crear('tr'),td=crear('td','muted','Sin resultados');td.colSpan=3;tr.append(td);cuerpo.append(tr)}$('#total').textContent=`Mostrando ${lista.length} de ${products.length} productos`;document.querySelectorAll('th').forEach(th=>{const active=th.dataset.key===clave;th.setAttribute('aria-sort',active?(direccion===1?'ascending':'descending'):'none');th.textContent=({name:'Producto',description:'Descripción',color:'Color'})[th.dataset.key]+' '+(active?(direccion===1?'↑':'↓'):'↕')})}document.querySelectorAll('th').forEach(th=>{const ordenar=()=>{if(clave===th.dataset.key)direccion*=-1;else{clave=th.dataset.key;direccion=1}render()};th.addEventListener('click',ordenar);th.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();ordenar()}})});$('#buscar').addEventListener('input',render);$('#colores').addEventListener('change',render);$('#estado').addEventListener('change',render);render();
</script></body></html>
